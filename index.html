<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor-pomodoro">
        <div class="modos">
            <button class="modo-btn activo" id="modo-trabajo">Pomodoro</button>
            <button class="modo-btn" id="modo-corto">Descanso Corto</button>
            <button class="modo-btn" id="modo-largo">Descanso Largo</button>
        </div>

        <div class="timer-display" id="timer">25:00</div>

        <div class="controles">
            <button class="ctrl-btn" id="btn-inicio" aria-label="Iniciar"></button>
            <button class="ctrl-btn" id="btn-pausa" aria-label="Pausa"></button>
            <button class="ctrl-btn" id="btn-reinicio" aria-label="Detener"></button>
        </div>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
